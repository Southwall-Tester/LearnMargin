name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, PDF rendering and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LEARNMARGIN_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true
      - name: Build and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Install Python
        timeout-minutes: 5
        run: |
          uv python install 3.13
          uv sync --frozen --extra dev --python 3.13
      - name: Install renderer
        timeout-minutes: 5
        run: |
          uv run playwright install --with-deps chromium
      - name: Install document sandbox dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk bubblewrap python3 apparmor-profiles libreoffice-writer libreoffice-impress
          dpkg-query -W bubblewrap libreoffice-writer libreoffice-impress
      - name: Enable the distribution's restricted Bubblewrap profile
        run: |
          # Ubuntu's profile grants userns to /usr/bin/bwrap and strips its
          # children's capabilities. Keep system-wide AppArmor restrictions.
          sudo install -o root -g root -m 644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/learnmargin-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/learnmargin-ci-bwrap
      - name: Allow installed test browsers to create their sandbox
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path.home() / ".cache" / "ms-playwright"
          browsers = [*cache.glob("chromium-*/chrome-linux64/chrome"),
                      *cache.glob("chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell")]
          assert len(browsers) == 2, "Expected the two freshly installed Playwright browsers"
          policy = "abi <abi/4.0>,\ninclude <tunables/global>\n"
          for index, browser in enumerate(browsers):
              browser = browser.resolve(strict=True)
              assert browser.is_file() and browser.is_relative_to(cache.resolve())
              assert re.fullmatch(r"[A-Za-z0-9_./-]+", str(browser))
              # Exact installed binaries only; do not disable userns restrictions
              # globally or allow arbitrary binaries under a wildcard path.
              policy += (f'profile learnmargin-ci-browser-{index} "{browser}" '
                         'flags=(unconfined) {\n  userns,\n}\n')
          (Path(os.environ["RUNNER_TEMP"]) / "learnmargin-ci-chromium").write_text(policy)
          PY
          sudo install -o root -g root -m 644 "$RUNNER_TEMP/learnmargin-ci-chromium" /etc/apparmor.d/learnmargin-ci-chromium
          sudo apparmor_parser -r /etc/apparmor.d/learnmargin-ci-chromium
      - name: Check application and skill
        run: |
          uv run ruff check src tests scripts
          uv run pytest -q
          uv run python scripts/check_skill.py
      - name: Check standalone skill renderer
        run: uv run --with pymupdf python -m pytest -q tests/test_skill_sidebars.py
      - name: Build distributable packages
        run: |
          uv run python -m build
          uv run python scripts/package_skill.py
      - name: Verify isolated wheel installation
        run: uv run python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: learnmargin-packages
          path: dist/*
          if-no-files-found: error
