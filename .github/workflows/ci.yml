name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, PDF rendering and packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true
      - name: Build and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Install Python and renderer
        run: |
          uv python install 3.13
          uv sync --frozen --extra dev --python 3.13
          uv run playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Check application and skill
        run: |
          uv run ruff check src tests scripts
          uv run pytest -q
          uv run python scripts/check_skill.py
      - name: Build distributable packages
        run: |
          uv run python -m build
          uv run python scripts/package_skill.py
      - name: Verify isolated wheel installation
        run: uv run python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: learnmargin-packages
          path: dist/*
          if-no-files-found: error
