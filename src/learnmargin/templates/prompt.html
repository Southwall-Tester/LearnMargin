<div class="study-card" id="prompt-{{ section_no }}-{{ prompt_no }}"><span class="card-kind">{{ prompt.id }} · {{ prompt.when | mdi }}</span>{{ prompt.task | md }}{% if prompt.answer %}<p class="answer-link"><a class="nav-button" href="#prompt-answer-{{ section_no }}-{{ prompt_no }}">{{ text.view_answer }} →</a></p>{% elif prompt.check %}<div class="check">{{ prompt.check | md }}</div>{% endif %}</div>
